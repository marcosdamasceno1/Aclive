    <script>
      // Busca o formulário já, em paralelo com o download do código.
      (function () {
        var m = window.location.pathname.match(/^\/f\/([a-z0-9-]+)\/([a-z0-9-]+)\/?$/i);
        if (!m) return;
        var key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5reHllY2R4Z2F4cG5lemZqa2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NzgzMTEsImV4cCI6MjA5NTI1NDMxMX0.norNo8ksplzq99jXD27iOYrbVcZuaCJ2XCpEIO2TIr0';
        window.__gxForm = fetch('https://nkxyecdxgaxpnezfjkap.supabase.co/rest/v1/rpc/get_public_form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: key, Authorization: 'Bearer ' + key },
          body: JSON.stringify({ p_agency: m[1].toLowerCase(), p_slug: m[2].toLowerCase() })
        }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      })();
