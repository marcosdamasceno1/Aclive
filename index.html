    <script>
      // Restore path encoded by 404.html redirect (SPA routing on static hosts)
      (function () {
        var r = new URLSearchParams(window.location.search).get('r');
        if (r) {
          var decoded = decodeURIComponent(r);
          window.history.replaceState(null, '', decoded);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
